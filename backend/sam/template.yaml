AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: MartyChat Lambda Functions for Local Development

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: python3.12
    Environment:
      Variables:
        NEXT_PUBLIC_FRONTEND_URL: "http://localhost:3000"
        NEXT_PUBLIC_API_URL: "http://localhost:8000"
        NEXT_PUBLIC_LAMBDA_URL: "http://localhost:9000"
        REGION_NAME: "us-east-1"
        API_SECRETS_PARAM: "/martychat/secrets/api_keys"
        PINECONE_ENV_PARAM: "/marty/pinecone/env"
        PINECONE_INDEX_PARAM: "/marty/pinecone/index"
        COGNITO_USER_PARAM: "/martychat/dev/cognito_user_pool_id"
        COGNITO_CLIENT_PARAM: "/martychat/dev/cognito_app_client_id"
        INFRA_SECRETS_PARAM: "/martychat/secrets/infrastructure_keys_dev"
  Api:
    Auth:
      DefaultAuthorizer: NONE  # Allow unauthenticated access
    Cors:
      AllowMethods: "'OPTIONS,POST'"
      AllowHeaders: "'Content-Type,Authorization,X-Requested-With'"
      AllowOrigin: "'*'"
      AllowCredentials: "'true'"

Resources:
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: "MartyChatAPI"
      StageName: "dev"
      Auth:
        DefaultAuthorizer: NONE  # Allow unauthenticated access
      Cors:
        AllowMethods: "'OPTIONS,POST'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              Access-Control-Allow-Methods: "'OPTIONS,POST'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              Access-Control-Allow-Methods: "'OPTIONS,POST'"

  CreateUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: create_user.lambda_handler
      CodeUri: ../lambda/
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        CreateUserApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: "/api/auth/signup"
            Method: POST
            Auth:
              Authorizer: NONE  # Explicitly allow unauthenticated access for signup

  SignInFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: sign_in.lambda_handler
      CodeUri: ../lambda/
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        SignInApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: "/api/auth/login"
            Method: POST
            Auth:
              Authorizer: NONE  # Allow unauthenticated access for login

  TokenRefreshFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: token_refresh.lambda_handler
      CodeUri: ../lambda/
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - cognito-idp:InitiateAuth
                - cognito-idp:DescribeUserPool
              Resource: '*'
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/martychat/dev/cognito_user_pool_id'
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/martychat/dev/cognito_app_client_id'
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/martychat/secrets/infrastructure_keys_dev'
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: '*'
      Events:
        TokenRefreshApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: "/api/auth/refresh"
            Method: POST
            Auth:
              Authorizer: NONE  # Allow unauthenticated access for token refresh
