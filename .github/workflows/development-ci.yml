name: Development CI

on:
  pull_request:
    branches: [ development ]

jobs:
  backend-test:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock ruff mypy types-requests types-PyYAML

      - name: Check YAML files
        run: |
          pip install pre-commit
          pre-commit run check-yaml --all-files

      - name: Check for large files
        run: pre-commit run check-added-large-files --all-files

      - name: Check JSON files
        run: pre-commit run check-json --all-files

      - name: Check TOML files
        run: pre-commit run check-toml --all-files

      - name: Check for private keys
        run: pre-commit run detect-private-key --all-files

      - name: Lint with Ruff
        run: |
          ruff check --fix --exit-non-zero-on-fix backend/
          ruff format --line-length=120 backend/

      - name: Check blanket noqa
        run: pre-commit run python-check-blanket-noqa --all-files

      - name: Check for eval()
        run: pre-commit run python-no-eval --all-files

      - name: Check type annotations
        run: pre-commit run python-use-type-annotations --all-files

      - name: Validate GitHub Workflows
        run: pre-commit run check-github-workflows --all-files

      - name: Check for secrets
        run: |
          curl -L https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | tar xz
          ./gitleaks detect --source . --verbose

      - name: Type check with mypy
        run: |
          pip install mypy types-requests types-PyYAML
          mypy --ignore-missing-imports backend/

      - name: Test with pytest
        run: |
          pytest backend/tests/

  frontend-test:
    name: Frontend Tests & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint with ESLint
        working-directory: frontend
        run: npm run lint

      - name: Format check with Prettier
        working-directory: frontend
        run: npx prettier --check "./**/*.{js,jsx,json,css,md}"

      - name: Run unit tests
        working-directory: frontend
        run: npm test

      - name: Check build
        working-directory: frontend
        run: npm run build

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run pip-audit (backend)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --ignore-vuln GHSA-hcpj-qp55-gfph
