AWSTemplateFormatVersion: "2010-09-09"
Description: Deploy multiple AWS Lambda functions

Parameters:
  Environment:
    Type: String
    Default: development
    AllowedValues:
      - development
      - staging
      - production

Resources:
  CreateUserLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "create_user-${Environment}"
      Handler: create_user.lambda_handler
      Role: arn:aws:iam::YOUR_ACCOUNT_ID:role/YOUR_LAMBDA_ROLE
      Code:
        S3Bucket: YOUR_S3_BUCKET
        S3Key: backend/lambda/create_user.zip
      Runtime: python3.12
      Environment:
        Variables:
          ENV: !Ref Environment

Outputs:
  CreateUserLambdaARN:
    Value: !GetAtt CreateUserLambda.Arn
